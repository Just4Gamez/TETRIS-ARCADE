<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Tetris Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #09090b 100%);
            color: #f8fafc;
        }
        .retro-font {
            font-family: 'Press Start 2P', monospace;
        }
        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between p-1 md:p-4 selection:bg-cyan-500 selection:text-white overflow-hidden select-none">

    <!-- Header Atas -->
    <header class="w-full max-w-md flex items-center justify-between px-3 py-0.5 bg-slate-900/80 backdrop-blur-md rounded-xl border border-purple-500/30 shadow-lg">
        <div class="w-7 h-7 flex items-center justify-center bg-indigo-950/80 rounded-lg border border-indigo-500/40 text-indigo-300">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
        </div>
        <div class="flex flex-col items-center">
            <span class="text-[7px] tracking-wider text-purple-300 font-semibold uppercase">SASARAN SKOR</span>
            <span id="target-score" class="retro-font text-[10px] text-amber-300 drop-shadow-[0_0_8px_rgba(252,211,77,0.6)]">2,000</span>
        </div>
        <div class="w-7 h-7 flex items-center justify-center bg-indigo-950/80 rounded-lg border border-indigo-500/40 text-indigo-300">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
        </div>
    </header>

    <!-- Bar Kemajuan -->
    <div class="w-full max-w-md px-3">
        <div class="flex justify-between text-[8px] text-purple-200 mb-0.5 font-medium">
            <span>Kemajuan</span>
            <span id="score-text">Skor: 0</span>
        </div>
        <div class="w-full bg-slate-900/80 rounded-full h-1.5 overflow-hidden border border-purple-500/30 p-0.5">
            <div id="progress-bar" class="bg-gradient-to-r from-purple-500 via-pink-500 to-amber-400 h-full rounded-full w-0 transition-all duration-300"></div>
        </div>
    </div>

    <!-- Kanvas Utama Permainan -->
    <main class="flex flex-col items-center justify-center w-full max-w-md my-auto px-2 gap-1">
        <div class="relative flex items-center justify-center p-1.5 bg-slate-900/95 border-2 border-purple-500/50 rounded-2xl shadow-[0_0_30px_rgba(168,85,247,0.3)]">
            <canvas id="tetris" width="240" height="340" class="bg-slate-950 rounded-xl shadow-inner w-[220px] h-[311px] sm:w-[260px] sm:h-[368px]"></canvas>

            <!-- Skrin Mula / Tamat -->
            <div id="game-overlay" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-4 text-center z-10">
                <div class="w-10 h-10 bg-gradient-to-tr from-purple-600 to-pink-500 rounded-xl flex items-center justify-center shadow-[0_0_20px_rgba(236,72,153,0.6)] mb-2 animate-bounce">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path></svg>
                </div>
                <h2 id="overlay-title" class="retro-font text-sm md:text-lg text-pink-400 mb-1 drop-shadow-[0_2px_8px_rgba(244,114,182,0.6)]">TETRIS ARCADE</h2>
                <p id="overlay-desc" class="text-[10px] text-purple-200 mb-3 leading-relaxed max-w-xs">Susun kiub dengan warna berkilat untuk capai sasaran skor!</p>
                <button id="start-btn" onclick="window.startTetrisGame()" class="retro-font relative group overflow-hidden bg-gradient-to-r from-purple-500 via-pink-500 to-amber-500 text-slate-950 font-extrabold px-5 py-2.5 rounded-xl shadow-[0_0_20px_rgba(236,72,153,0.5)] active:scale-95 transition-all text-[10px] border border-pink-300/40 cursor-pointer">
                    MULA MAIN
                </button>
            </div>
        </div>

        <!-- Panel Blok Seterusnya & Jeda -->
        <div class="flex items-center justify-between w-full bg-slate-900/90 border border-purple-500/30 px-2.5 py-1 rounded-xl shadow-xl backdrop-blur-md">
            <div class="flex items-center gap-1 py-0.5">
                <span class="text-[7px] text-purple-300 font-bold uppercase mr-0.5">SETERUSNYA:</span>
                <canvas id="nextCanvas1" width="35" height="30" class="bg-slate-950/80 rounded-lg border border-purple-500/30"></canvas>
                <canvas id="nextCanvas2" width="30" height="25" class="bg-slate-950/60 rounded-lg border border-purple-500/20 opacity-80"></canvas>
                <canvas id="nextCanvas3" width="25" height="20" class="bg-slate-950/40 rounded-lg border border-purple-500/10 opacity-50"></canvas>
            </div>
            
            <div onclick="window.toggleGamePause()" class="flex flex-col items-center justify-center bg-indigo-950/90 border border-purple-500/40 px-2.5 py-1 rounded-lg cursor-pointer active:scale-95 shadow-inner">
                <span id="pause-label" class="text-[7px] font-bold tracking-widest text-pink-300 uppercase">JEDA</span>
                <svg class="w-4 h-4 text-pink-300 mt-0.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>

            <div class="bg-indigo-950/80 border border-purple-500/30 px-2.5 py-0.5 rounded-lg text-center shadow-inner">
                <span class="text-[7px] font-bold tracking-widest text-purple-300 block uppercase">TAHAP</span>
                <!-- Updated level display format up to Level 99 -->
                <span id="level" class="retro-font text-amber-300 text-[10px]">1/99</span>
                <span id="next-level-info" class="text-[6px] text-purple-300/80 block">2,000 pts</span>
            </div>
        </div>
    </main>

    <!-- Bar Kawalan Bawah - Butang Lebih Besar & Selesa -->
    <nav class="w-full max-w-md px-3 pb-2">
        <div class="grid grid-cols-5 gap-2.5 bg-slate-900/95 p-2.5 rounded-2xl border border-purple-500/40 shadow-2xl backdrop-blur-md">
            <button onclick="window.actionMove(-1)" class="flex flex-col items-center justify-center bg-gradient-to-b from-slate-800 to-slate-900 active:from-purple-600 active:to-indigo-600 text-purple-300 active:text-white py-4 rounded-2xl border border-slate-700/80 shadow-lg active:scale-95 transition-all">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <button onclick="window.actionRotate()" class="flex flex-col items-center justify-center bg-gradient-to-b from-purple-600 to-indigo-700 active:from-purple-500 text-white py-4 rounded-2xl border border-purple-400/40 shadow-lg active:scale-95 transition-all">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
            <button onclick="window.actionSoftDrop()" class="flex flex-col items-center justify-center bg-gradient-to-b from-slate-800 to-slate-900 active:from-indigo-600 text-indigo-300 active:text-white py-4 rounded-2xl border border-indigo-700/60 shadow-lg active:scale-95 transition-all">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
            </button>
            <button onclick="window.actionHardDrop()" class="flex flex-col items-center justify-center bg-gradient-to-b from-amber-500 to-orange-600 active:from-amber-400 text-white py-4 rounded-2xl border border-amber-300/40 shadow-lg active:scale-95 transition-all">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="3.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 13l-7 7-7-7m14-8l-7 7-7-7"></path></svg>
            </button>
            <button onclick="window.actionMove(1)" class="flex flex-col items-center justify-center bg-gradient-to-b from-slate-800 to-slate-900 active:from-purple-600 text-purple-300 active:text-white py-4 rounded-2xl border border-slate-700/80 shadow-lg active:scale-95 transition-all">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </nav>

    <!-- Skrip Permainan Tetris Sepenuhnya Stabil -->
    <script>
        (function() {
            let canvas, ctx;
            let nextCtx1, nextCtx2, nextCtx3;
            let arena = [];
            let queue = [];
            let player = { pos: { x: 0, y: 0 }, matrix: null, score: 0, lines: 0, level: 1 };
            let isPlaying = false;
            let isPaused = false;
            let dropCounter = 0;
            let dropInterval = 1000;
            let lastTime = 0;
            let animId = null;

            // Sistem Bunyi Retro (Web Audio API)
            let audioCtx = null;
            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            function playSound(type) {
                try {
                    initAudio();
                    if (!audioCtx) return;
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    const now = audioCtx.currentTime;
                    if (type === 'move') {
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(150, now);
                        gain.gain.setValueAtTime(0.05, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                    } else if (type === 'rotate') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(500, now + 0.08);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                        osc.start(now);
                        osc.stop(now + 0.08);
                    } else if (type === 'drop') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(220, now);
                        osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
                        gain.gain.setValueAtTime(0.1, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                        osc.start(now);
                        osc.stop(now + 0.12);
                    } else if (type === 'clear') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.setValueAtTime(660, now + 0.08);
                        osc.frequency.setValueAtTime(880, now + 0.16);
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                    }
                } catch(e) {}
            }

            const colors = [
                null,
                '#ec4899', // T
                '#06b6d4', // I
                '#10b981', // S
                '#a855f7', // Z
                '#f97316', // L
                '#eab308', // J
                '#3b82f6', // O
            ];

            function makeMatrix(w, h) {
                const m = [];
                while (h--) m.push(new Array(w).fill(0));
                return m;
            }

            function getPiece(type) {
                if (type === 'T') return [[0,1,0],[1,1,1],[0,0,0]];
                if (type === 'I') return [[0,2,0,0],[0,2,0,0],[0,2,0,0],[0,2,0,0]];
                if (type === 'S') return [[0,3,3],[3,3,0],[0,0,0]];
                if (type === 'Z') return [[4,4,0],[0,4,4],[0,0,0]];
                if (type === 'L') return [[0,5,0],[0,5,0],[0,5,5]];
                if (type === 'J') return [[0,6,0],[0,6,0],[6,6,0]];
                if (type === 'O') return [[7,7],[7,7]];
                return [[1]];
            }

            function randType() {
                const chars = 'TJLOSZI';
                return chars[(Math.random() * chars.length) | 0];
            }

            function refillQueue() {
                while (queue.length < 5) {
                    queue.push(randType());
                }
            }

            function initGameVars() {
                arena = makeMatrix(12, 17);
                queue = [];
                refillQueue();
                player.score = 0;
                player.lines = 0;
                player.level = 1;
                dropInterval = 1500; // Bermula perlahan (1.5 saat pada Tahap 1)
            }

            function checkCollide(ar, pl) {
                const [m, o] = [pl.matrix, pl.pos];
                for (let y = 0; y < m.length; ++y) {
                    for (let x = 0; x < m[y].length; ++x) {
                        if (m[y][x] !== 0 && (ar[y + o.y] && ar[y + o.y][x + o.x]) !== 0) {
                            return true;
                        }
                    }
                }
                return false;
            }

            function mergePiece() {
                player.matrix.forEach((row, y) => {
                    row.forEach((val, x) => {
                        if (val !== 0) {
                            if (arena[y + player.pos.y] && arena[y + player.pos.y][x + player.pos.x] !== undefined) {
                                arena[y + player.pos.y][x + player.pos.x] = val;
                            }
                        }
                    });
                });
            }

            function rotateMatrix(m, dir) {
                for (let y = 0; y < m.length; ++y) {
                    for (let x = 0; x < y; ++x) {
                        [m[x][y], m[y][x]] = [m[y][x], m[x][y]];
                    }
                }
                if (dir > 0) m.forEach(row => row.reverse());
                else m.reverse();
            }

            function resetPlayer() {
                refillQueue();
                const nextT = queue.shift();
                player.matrix = getPiece(nextT);
                player.pos.y = 0;
                player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

                if (checkCollide(arena, player)) {
                    triggerGameOver();
                }
                drawQueuePreviews();
            }

            function clearLines() {
                let count = 0;
                outer: for (let y = arena.length - 1; y > 0; --y) {
                    for (let x = 0; x < arena[y].length; ++x) {
                        if (arena[y][x] === 0) continue outer;
                    }
                    const removed = arena.splice(y, 1)[0].fill(0);
                    arena.unshift(removed);
                    ++y;
                    count++;
                }
                if (count > 0) {
                    playSound('clear');
                    const pts = [0, 40, 100, 300, 1200];
                    player.score += pts[count] * player.level;
                    player.lines += count;
                    // Expanded maximum level up to 99
                    player.level = Math.min(99, Math.floor(player.lines / 8) + 1);
                    dropInterval = Math.max(80, 1500 - (player.level - 1) * 14);
                    updateScoreDisplay();
                }
            }

            function drawBlock(matrix, offset, targetCtx) {
                if (!matrix || !targetCtx) return;
                matrix.forEach((row, y) => {
                    row.forEach((val, x) => {
                        if (val !== 0) {
                            const px = x + offset.x;
                            const py = y + offset.y;
                            const c = colors[val] || '#ec4899';
                            targetCtx.fillStyle = c;
                            targetCtx.fillRect(px, py, 1, 1);
                            targetCtx.strokeStyle = 'rgba(0,0,0,0.5)';
                            targetCtx.lineWidth = 0.05;
                            targetCtx.strokeRect(px, py, 1, 1);
                        }
                    });
                });
            }

            function drawGhost() {
                if (!player.matrix || !ctx) return;
                const ghost = { pos: { x: player.pos.x, y: player.pos.y }, matrix: player.matrix };
                while (!checkCollide(arena, ghost)) {
                    ghost.pos.y++;
                }
                ghost.pos.y--;

                player.matrix.forEach((row, y) => {
                    row.forEach((val, x) => {
                        if (val !== 0) {
                            ctx.fillStyle = 'rgba(255,255,255,0.12)';
                            ctx.fillRect(x + ghost.pos.x, y + ghost.pos.y, 1, 1);
                        }
                    });
                });
            }

            function drawQueuePreviews() {
                if (queue.length < 3) refillQueue();
                if (nextCtx1) {
                    nextCtx1.fillStyle = '#09090b';
                    nextCtx1.fillRect(0, 0, nextCtx1.canvas.width, nextCtx1.canvas.height);
                    drawBlock(getPiece(queue[0]), { x: 0.5, y: 0.3 }, nextCtx1);
                }
                if (nextCtx2) {
                    nextCtx2.fillStyle = '#09090b';
                    nextCtx2.fillRect(0, 0, nextCtx2.canvas.width, nextCtx2.canvas.height);
                    drawBlock(getPiece(queue[1]), { x: 0.4, y: 0.2 }, nextCtx2);
                }
                if (nextCtx3) {
                    nextCtx3.fillStyle = '#09090b';
                    nextCtx3.fillRect(0, 0, nextCtx3.canvas.width, nextCtx3.canvas.height);
                    drawBlock(getPiece(queue[2]), { x: 0.2, y: 0.1 }, nextCtx3);
                }
            }

            function renderScene() {
                if (!ctx || !canvas) return;
                ctx.fillStyle = '#09090b';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Grid bg
                ctx.strokeStyle = 'rgba(168, 85, 247, 0.15)';
                ctx.lineWidth = 0.04;
                for (let i = 0; i <= canvas.width / 20; i++) {
                    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height / 20); ctx.stroke();
                }
                for (let j = 0; j <= canvas.height / 20; j++) {
                    ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width / 20, j); ctx.stroke();
                }

                drawBlock(arena, { x: 0, y: 0 }, ctx);
                if (isPlaying && player.matrix) {
                    drawGhost();
                    drawBlock(player.matrix, player.pos, ctx);
                }
            }

            function gameLoop(time = 0) {
                if (!isPlaying || isPaused) return;
                const delta = time - lastTime;
                lastTime = time;
                dropCounter += delta;
                if (dropCounter > dropInterval) {
                    playerDropStep();
                }
                renderScene();
                animId = requestAnimationFrame(gameLoop);
            }

            function playerDropStep() {
                player.pos.y++;
                if (checkCollide(arena, player)) {
                    player.pos.y--;
                    mergePiece();
                    resetPlayer();
                    clearLines();
                    updateScoreDisplay();
                }
                dropCounter = 0;
            }

            function updateScoreDisplay() {
                const sEl = document.getElementById('score-text');
                const lEl = document.getElementById('level');
                const bEl = document.getElementById('progress-bar');
                const nxtInfo = document.getElementById('next-level-info');
                
                if (sEl) sEl.innerText = `Skor: ${player.score}`;
                if (lEl) lEl.innerText = `${player.level}/99`;
                
                // Kira mata berbaki untuk sasaran 2,000 mata
                const remaining = Math.max(0, 2000 - player.score);
                if (nxtInfo) {
                    if (player.score >= 2000) {
                        nxtInfo.innerText = "SASARAN CAPAI!";
                        nxtInfo.classList.add("text-emerald-400");
                    } else {
                        nxtInfo.innerText = `Lagi ${remaining} pts`;
                    }
                }

                if (bEl) {
                    const pct = Math.min(100, (player.score / 2000) * 100);
                    bEl.style.width = pct + '%';
                }
            }

            function triggerGameOver() {
                isPlaying = false;
                if (animId) cancelAnimationFrame(animId);
                const overlay = document.getElementById('game-overlay');
                if (overlay) {
                    document.getElementById('overlay-title').innerText = 'TAMAT PERMAINAN';
                    document.getElementById('overlay-desc').innerHTML = `Skor Akhir: <strong class="text-pink-400 text-sm">${player.score}</strong><br>Tahap: <strong class="text-amber-300">${player.level}</strong>`;
                    document.getElementById('start-btn').innerText = 'MAIN SEMULA';
                    overlay.classList.remove('hidden');
                }
            }

            // Global Actions
            window.startTetrisGame = function() {
                initAudio();
                initGameVars();
                isPlaying = true;
                isPaused = false;
                const overlay = document.getElementById('game-overlay');
                if (overlay) overlay.classList.add('hidden');
                resetPlayer();
                updateScoreDisplay();
                lastTime = performance.now();
                if (animId) cancelAnimationFrame(animId);
                gameLoop();
            };

            window.toggleGamePause = function() {
                if (!isPlaying) return;
                isPaused = !isPaused;
                const overlay = document.getElementById('game-overlay');
                if (isPaused) {
                    document.getElementById('overlay-title').innerText = 'PERMAINAN DIJEDA';
                    document.getElementById('overlay-desc').innerHTML = `Skor Semasa: <strong class="text-pink-400 text-sm">${player.score}</strong>`;
                    document.getElementById('start-btn').innerText = 'SAMBUNG MAIN';
                    if (overlay) overlay.classList.remove('hidden');
                } else {
                    if (overlay) overlay.classList.add('hidden');
                    lastTime = performance.now();
                    gameLoop();
                }
            };

            window.actionMove = function(dir) {
                if (!isPlaying || isPaused) return;
                player.pos.x += dir;
                if (checkCollide(arena, player)) {
                    player.pos.x -= dir;
                } else {
                    playSound('move');
                }
            };

            window.actionRotate = function() {
                if (!isPlaying || isPaused) return;
                const px = player.pos.x;
                let offset = 1;
                rotateMatrix(player.matrix, 1);
                while (checkCollide(arena, player)) {
                    player.pos.x += offset;
                    offset = -(offset + (offset > 0 ? 1 : -1));
                    if (offset > player.matrix[0].length) {
                        rotateMatrix(player.matrix, -1);
                        player.pos.x = px;
                        return;
                    }
                }
                playSound('rotate');
            };

            window.actionSoftDrop = function() {
                if (!isPlaying || isPaused) return;
                playerDropStep();
                playSound('move');
            };

            window.actionHardDrop = function() {
                if (!isPlaying || isPaused) return;
                while (!checkCollide(arena, player)) {
                    player.pos.y++;
                }
                player.pos.y--;
                mergePiece();
                resetPlayer();
                clearLines();
                updateScoreDisplay();
                dropCounter = 0;
                playSound('drop');
            };

            // Keyboard listener
            window.addEventListener('keydown', e => {
                if (!isPlaying || isPaused) return;
                if (e.key === 'ArrowLeft') window.actionMove(-1);
                else if (e.key === 'ArrowRight') window.actionMove(1);
                else if (e.key === 'ArrowDown') window.actionSoftDrop();
                else if (e.key === 'ArrowUp') window.actionRotate();
                else if (e.key === ' ') { e.preventDefault(); window.actionHardDrop(); }
            });

            // Initial setup on DOM ready
            window.addEventListener('DOMContentLoaded', () => {
                canvas = document.getElementById('tetris');
                if (canvas) ctx = canvas.getContext('2d');
                if (ctx) ctx.scale(20, 20);

                const c1 = document.getElementById('nextCanvas1');
                const c2 = document.getElementById('nextCanvas2');
                const c3 = document.getElementById('nextCanvas3');
                if (c1) nextCtx1 = c1.getContext('2d');
                if (c2) nextCtx2 = c2.getContext('2d');
                if (c3) nextCtx3 = c3.getContext('2d');

                if (nextCtx1) nextCtx1.scale(10, 10);
                if (nextCtx2) nextCtx2.scale(8, 8);
                if (nextCtx3) nextCtx3.scale(6, 6);

                arena = makeMatrix(12, 17);
                refillQueue();
                player.matrix = getPiece(queue[0]);
                renderScene();
            });
        })();
    </script>
</body>
</html>
