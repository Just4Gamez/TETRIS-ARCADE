<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Arcade — Edisi Moden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        html, body {
            height: 100dvh;
            width: 100%;
            max-width: 100vw;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            font-family: 'Chakra Petch', 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 20%, #172554 0%, #090d1f 60%, #040711 100%);
            color: #f8fafc;
        }
        .retro-font {
            font-family: 'Press Start 2P', monospace;
        }
        .board-grid-bg {
            background-color: #0b1942;
            background-image:
                linear-gradient(to right, rgba(37, 99, 235, 0.22) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(37, 99, 235, 0.22) 1px, transparent 1px);
            background-size: 25px 25px;
        }
        .panel-bevel {
            background: linear-gradient(180deg, #1d3575 0%, #11204c 100%);
            box-shadow:
                inset 0 2px 0 rgba(147, 197, 253, 0.35),
                inset 0 -3px 0 rgba(5, 11, 31, 0.8),
                0 6px 14px rgba(0, 0, 0, 0.45);
        }
        .btn-3d {
            transition: transform 0.06s ease;
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.35),
                0 4px 0 rgba(5, 10, 28, 0.9),
                0 6px 12px rgba(0, 0, 0, 0.45);
        }
        .btn-3d:active {
            transform: translateY(3px);
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.2),
                0 1px 0 rgba(5, 10, 28, 0.9),
                0 2px 5px rgba(0, 0, 0, 0.4);
        }
        @keyframes comboPop {
            0% { transform: translate(-50%, 6px) scale(0.75); opacity: 0; }
            20% { transform: translate(-50%, 0px) scale(1.1); opacity: 1; }
            80% { transform: translate(-50%, -5px) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -12px) scale(0.95); opacity: 0; }
        }
        .combo-anim {
            animation: comboPop 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between px-2.5 py-2 gap-1.5">

    <!-- Bar Atas: Sasaran Skor, Kemajuan & Jeda -->
    <header class="w-full max-w-md flex items-center justify-between gap-2 shrink-0 z-20">
        <div class="panel-bevel flex-1 min-w-0 rounded-xl px-2.5 py-1.5 border border-blue-400/35 flex items-center justify-between gap-2.5">
            <div class="flex flex-col shrink-0">
                <span class="text-[10px] tracking-wider text-sky-300 font-bold uppercase">Sasaran</span>
                <span id="target-score" class="retro-font text-xs text-amber-300 drop-shadow-[0_0_8px_rgba(251,191,36,0.5)]">2,000</span>
            </div>

            <div class="flex-1 min-w-0">
                <div class="flex justify-between text-xs font-bold text-sky-100 mb-1">
                    <span id="score-text" class="truncate">Skor: 0</span>
                    <span id="progress-pct" class="text-amber-300 ml-1 shrink-0">0%</span>
                </div>
                <div class="w-full bg-slate-950/90 rounded-full h-2.5 overflow-hidden border border-blue-400/30 p-[1px]">
                    <div id="progress-bar" class="bg-gradient-to-r from-cyan-400 via-pink-500 to-amber-400 h-full rounded-full w-0 transition-all duration-300"></div>
                </div>
            </div>
        </div>

        <button onclick="window.toggleGamePause()" aria-label="Jeda Permainan" class="btn-3d panel-bevel rounded-xl px-3 py-1.5 border border-blue-300/35 flex flex-col items-center justify-center shrink-0 cursor-pointer">
            <svg class="w-5 h-5 text-amber-300" fill="currentColor" viewBox="0 0 24 24">
                <path d="M6 5h4v14H6zm8 0h4v14h-4z"/>
            </svg>
            <span id="pause-label" class="text-[10px] font-bold tracking-wider text-sky-200 mt-0.5 uppercase">Jeda</span>
        </button>
    </header>

    <!-- Bar Info Ringkas: NEXT, TAHAP & GERAKAN -->
    <section class="w-full max-w-md grid grid-cols-3 gap-1.5 shrink-0 z-20">
        <!-- NEXT -->
        <div class="panel-bevel rounded-xl px-2 py-1 border border-blue-400/35 flex items-center justify-between gap-1">
            <div class="flex flex-col">
                <span class="retro-font text-[9px] text-amber-300 tracking-wider">NEXT</span>
                <span class="text-[10px] text-sky-200 font-semibold">Seterusnya</span>
            </div>
            <div class="flex items-center gap-1">
                <canvas id="nextCanvas1" width="54" height="42" class="bg-slate-950/85 rounded-md border border-blue-400/30 w-11 h-8"></canvas>
                <canvas id="nextCanvas2" width="38" height="30" class="bg-slate-950/65 rounded-md border border-blue-400/20 w-7 h-6 opacity-85"></canvas>
            </div>
        </div>

        <!-- TAHAP -->
        <div class="panel-bevel rounded-xl px-2 py-1 border border-blue-400/35 flex flex-col items-center justify-center text-center">
            <span class="text-[10px] font-bold tracking-wider text-sky-300 uppercase">Tahap</span>
            <span id="level" class="retro-font text-xs text-amber-300 leading-tight">1/99</span>
            <span id="next-level-info" class="text-[10px] font-semibold text-cyan-200 leading-tight">Lagi 2,000 pts</span>
        </div>

        <!-- GERAKAN & BARIS -->
        <div class="panel-bevel rounded-xl px-2 py-1 border border-blue-400/35 flex flex-col items-center justify-center text-center">
            <span class="text-[10px] font-bold tracking-wider text-sky-300 uppercase">Gerakan</span>
            <span id="moves-count" class="retro-font text-xs text-emerald-300 leading-tight">0</span>
            <span id="lines-count" class="text-[10px] font-semibold text-sky-200 leading-tight">0 Baris</span>
        </div>
    </section>

    <!-- Papan Permainan Utama -->
    <main class="w-full max-w-md flex-1 min-h-0 flex items-center justify-center">
        <div class="relative h-full max-h-full aspect-[10/18] flex items-center justify-center p-1.5 rounded-2xl bg-gradient-to-b from-blue-400/50 via-indigo-500/30 to-blue-900/60 shadow-[0_0_24px_rgba(37,99,235,0.4)] border border-sky-300/40">
            <canvas id="tetris" width="300" height="600" class="w-full h-full rounded-xl board-grid-bg shadow-inner block"></canvas>

            <!-- Pop-up COMBO -->
            <div id="combo-badge" class="hidden combo-anim pointer-events-none absolute top-6 left-1/2 z-10 whitespace-nowrap">
                <div class="px-3.5 py-1 rounded-full bg-gradient-to-r from-amber-400 via-orange-500 to-pink-500 text-slate-950 font-extrabold text-sm tracking-wider shadow-[0_0_18px_rgba(251,191,36,0.85)] border border-white/60">
                    COMBO <span id="combo-num">1</span>x!
                </div>
            </div>

            <!-- Skrin Mula / Jeda / Tamat (Tulisan Besar & Jelas) -->
            <div id="game-overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center p-4 text-center z-20">
                <div class="w-12 h-12 bg-gradient-to-tr from-sky-500 via-indigo-500 to-amber-400 rounded-2xl flex items-center justify-center shadow-[0_0_20px_rgba(56,189,248,0.65)] mb-3">
                    <svg class="w-6 h-6 text-slate-950 ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </div>
                <h2 id="overlay-title" class="retro-font text-sm text-amber-300 mb-2.5 leading-relaxed drop-shadow-[0_2px_10px_rgba(251,191,36,0.45)]">
                    TETRIS ARCADE
                </h2>
                <p id="overlay-desc" class="text-sm text-sky-100 mb-4 leading-relaxed max-w-[240px] font-medium">
                    Susun kiub &amp; penuhkan baris. Guna butang di bawah atau leret papan.
                </p>
                <button id="start-btn" onclick="window.startTetrisGame()" class="btn-3d retro-font bg-gradient-to-r from-amber-400 via-orange-400 to-pink-500 text-slate-950 font-extrabold px-5 py-3 rounded-xl text-xs cursor-pointer">
                    MULA MAIN
                </button>
            </div>
        </div>
    </main>

    <!-- Bar Kawalan Bawah: Semua Butang Besar & Tersusun Di Bawah -->
    <nav class="w-full max-w-md shrink-0 z-20">
        <div class="grid grid-cols-5 gap-1.5 bg-slate-950/85 p-1.5 rounded-2xl border border-blue-400/35 backdrop-blur-md">
            <!-- Kiri -->
            <button onclick="window.actionMove(-1)" aria-label="Gerak Kiri" class="btn-3d bg-gradient-to-b from-blue-500 to-blue-700 text-white py-3 rounded-xl border border-sky-300/35 flex flex-col items-center justify-center cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                </svg>
                <span class="text-[10px] font-bold tracking-wide mt-0.5">KIRI</span>
            </button>

            <!-- Pusing -->
            <button onclick="window.actionRotate()" aria-label="Pusing Blok" class="btn-3d bg-gradient-to-b from-purple-500 to-indigo-700 text-white py-3 rounded-xl border border-purple-300/40 flex flex-col items-center justify-center cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                <span class="text-[10px] font-bold tracking-wide mt-0.5">PUSING</span>
            </button>

            <!-- Turun Perlahan -->
            <button onclick="window.actionSoftDrop()" aria-label="Turun Perlahan" class="btn-3d bg-gradient-to-b from-cyan-500 to-blue-700 text-white py-3 rounded-xl border border-cyan-300/35 flex flex-col items-center justify-center cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
                </svg>
                <span class="text-[10px] font-bold tracking-wide mt-0.5">TURUN</span>
            </button>

            <!-- Jatuh Terus -->
            <button onclick="window.actionHardDrop()" aria-label="Jatuh Terus" class="btn-3d bg-gradient-to-b from-amber-400 to-orange-600 text-slate-950 py-3 rounded-xl border border-amber-200/50 flex flex-col items-center justify-center cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 13l-7 7-7-7m14-8l-7 7-7-7"/>
                </svg>
                <span class="text-[10px] font-extrabold tracking-wide mt-0.5">DROPP</span>
            </button>

            <!-- Kanan -->
            <button onclick="window.actionMove(1)" aria-label="Gerak Kanan" class="btn-3d bg-gradient-to-b from-blue-500 to-blue-700 text-white py-3 rounded-xl border border-sky-300/35 flex flex-col items-center justify-center cursor-pointer">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                </svg>
                <span class="text-[10px] font-bold tracking-wide mt-0.5">KANAN</span>
            </button>
        </div>
    </nav>

    <script>
        (function() {
            const COLS = 12;
            const ROWS = 24;
            const CELL = 25;

            let canvas, ctx;
            let nextCtx1, nextCtx2;
            let arena = [];
            let queue = [];
            let player = {
                pos: { x: 0, y: 0 },
                matrix: null,
                score: 0,
                lines: 0,
                level: 1,
                moves: 0,
                combo: 0
            };

            let isPlaying = false;
            let isPaused = false;
            let dropCounter = 0;
            let dropInterval = 1100;
            let lastTime = 0;
            let animId = null;

            let audioCtx = null;
            function initAudio() {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            function playSound(type) {
                try {
                    initAudio();
                    if (!audioCtx) return;
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    const now = audioCtx.currentTime;
                    if (type === 'move') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(180, now);
                        gain.gain.setValueAtTime(0.05, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
                        osc.start(now); osc.stop(now + 0.045);
                    } else if (type === 'rotate') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(340, now);
                        osc.frequency.exponentialRampToValueAtTime(560, now + 0.07);
                        gain.gain.setValueAtTime(0.08, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                        osc.start(now); osc.stop(now + 0.07);
                    } else if (type === 'drop') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(240, now);
                        osc.frequency.exponentialRampToValueAtTime(75, now + 0.11);
                        gain.gain.setValueAtTime(0.09, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
                        osc.start(now); osc.stop(now + 0.11);
                    } else if (type === 'clear') {
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(523.25, now);
                        osc.frequency.setValueAtTime(659.25, now + 0.07);
                        osc.frequency.setValueAtTime(783.99, now + 0.14);
                        osc.frequency.setValueAtTime(1046.5, now + 0.21);
                        gain.gain.setValueAtTime(0.14, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
                        osc.start(now); osc.stop(now + 0.32);
                    }
                } catch (e) {}
            }

            const pieceStyles = {
                1: { fill: '#f97316', light: '#fdba74', dark: '#c2410c' },
                2: { fill: '#facc15', light: '#fef08a', dark: '#ca8a04' },
                3: { fill: '#f43f5e', light: '#fda4af', dark: '#be123c' },
                4: { fill: '#22c55e', light: '#86efac', dark: '#15803d' },
                5: { fill: '#a855f7', light: '#d8b4fe', dark: '#7e22ce' },
                6: { fill: '#3b82f6', light: '#93c5fd', dark: '#1d4ed8' },
                7: { fill: '#06b6d4', light: '#67e8f9', dark: '#0e7490' }
            };

            function makeMatrix(w, h) {
                return Array.from({ length: h }, () => new Array(w).fill(0));
            }

            function getPiece(type) {
                switch (type) {
                    case 'T': return [[0, 5, 0], [5, 5, 5], [0, 0, 0]];
                    case 'I': return [[0, 7, 0, 0], [0, 7, 0, 0], [0, 7, 0, 0], [0, 7, 0, 0]];
                    case 'S': return [[0, 4, 4], [4, 4, 0], [0, 0, 0]];
                    case 'Z': return [[3, 3, 0], [0, 3, 3], [0, 0, 0]];
                    case 'L': return [[0, 0, 1], [1, 1, 1], [0, 0, 0]];
                    case 'J': return [[6, 0, 0], [6, 6, 6], [0, 0, 0]];
                    case 'O': return [[2, 2], [2, 2]];
                    default: return [[5]];
                }
            }

            function randType() {
                const chars = 'TJLOSZI';
                return chars[(Math.random() * chars.length) | 0];
            }

            function refillQueue() {
                while (queue.length < 5) {
                    queue.push(randType());
                }
            }

            function initGameVars() {
                arena = makeMatrix(COLS, ROWS);
                queue = [];
                refillQueue();
                player.score = 0;
                player.lines = 0;
                player.level = 1;
                player.moves = 0;
                player.combo = 0;
                dropInterval = 1100;
            }

            function checkCollide(ar, pl) {
                const [m, o] = [pl.matrix, pl.pos];
                for (let y = 0; y < m.length; ++y) {
                    for (let x = 0; x < m[y].length; ++x) {
                        if (m[y][x] !== 0) {
                            const nx = x + o.x;
                            const ny = y + o.y;
                            if (nx < 0 || nx >= ar[0].length || ny >= ar.length) return true;
                            if (ny >= 0 && ar[ny][nx] !== 0) return true;
                        }
                    }
                }
                return false;
            }

            function mergePiece() {
                player.matrix.forEach((row, y) => {
                    row.forEach((val, x) => {
                        if (val !== 0) {
                            const ay = y + player.pos.y;
                            const ax = x + player.pos.x;
                            if (arena[ay] && arena[ay][ax] !== undefined) {
                                arena[ay][ax] = val;
                            }
                        }
                    });
                });
                player.moves += 1;
            }

            function rotateMatrix(m, dir) {
                for (let y = 0; y < m.length; ++y) {
                    for (let x = 0; x < y; ++x) {
                        [m[x][y], m[y][x]] = [m[y][x], m[x][y]];
                    }
                }
                if (dir > 0) m.forEach(row => row.reverse());
                else m.reverse();
            }

            function showComboBadge(comboCount) {
                const badge = document.getElementById('combo-badge');
                const num = document.getElementById('combo-num');
                if (!badge || !num) return;
                num.innerText = comboCount;
                badge.classList.remove('hidden', 'combo-anim');
                void badge.offsetWidth;
                badge.classList.add('combo-anim');
            }

            function resetPlayer() {
                refillQueue();
                const nextT = queue.shift();
                player.matrix = getPiece(nextT);
                player.pos.y = 0;
                player.pos.x = ((COLS / 2) | 0) - ((player.matrix[0].length / 2) | 0);

                if (checkCollide(arena, player)) {
                    triggerGameOver();
                }
                drawQueuePreviews();
            }

            function clearLines() {
                let count = 0;
                outer: for (let y = arena.length - 1; y >= 0; --y) {
                    for (let x = 0; x < arena[y].length; ++x) {
                        if (arena[y][x] === 0) continue outer;
                    }
                    const removed = arena.splice(y, 1)[0].fill(0);
                    arena.unshift(removed);
                    ++y;
                    count++;
                }

                if (count > 0) {
                    player.combo += 1;
                    playSound('clear');
                    const basePts = [0, 100, 300, 600, 1000];
                    const comboBonus = player.combo > 1 ? (player.combo - 1) * 75 : 0;
                    player.score += (basePts[count] + comboBonus) * player.level;
                    player.lines += count;
                    player.level = Math.min(99, Math.floor(player.lines / 6) + 1);
                    dropInterval = Math.max(110, 1100 - (player.level - 1) * 14);
                    showComboBadge(player.combo);
                } else {
                    player.combo = 0;
                }
                updateScoreDisplay();
            }

            function drawRoundedRect(targetCtx, x, y, w, h, r) {
                targetCtx.beginPath();
                targetCtx.roundRect(x, y, w, h, r);
            }

            function drawSingleCube(targetCtx, gx, gy, val, cellSize) {
                const st = pieceStyles[val] || pieceStyles[5];
                const px = gx * cellSize;
                const py = gy * cellSize;
                const pad = Math.max(1, cellSize * 0.05);
                const s = cellSize - pad * 2;
                const r = Math.max(3, cellSize * 0.18);

                drawRoundedRect(targetCtx, px + pad, py + pad, s, s, r);
                targetCtx.fillStyle = st.fill;
                targetCtx.fill();

                targetCtx.save();
                drawRoundedRect(targetCtx, px + pad, py + pad, s, s, r);
                targetCtx.clip();

                targetCtx.fillStyle = st.light;
                targetCtx.fillRect(px + pad, py + pad, s, Math.max(2, s * 0.18));
                targetCtx.fillRect(px + pad, py + pad, Math.max(2, s * 0.16), s);

                targetCtx.fillStyle = st.dark;
                targetCtx.fillRect(px + pad, py + pad + s - Math.max(2, s * 0.2), s, Math.max(2, s * 0.2));
                targetCtx.fillRect(px + pad + s - Math.max(2, s * 0.18), py + pad, Math.max(2, s * 0.18), s);

                targetCtx.fillStyle = 'rgba(255,255,255,0.45)';
                targetCtx.beginPath();
                targetCtx.arc(px + pad + s * 0.24, py + pad + s * 0.24, Math.max(1.2, s * 0.08), 0, Math.PI * 2);
                targetCtx.fill();
                targetCtx.restore();

                drawRoundedRect(targetCtx, px + pad, py + pad, s, s, r);
                targetCtx.strokeStyle = 'rgba(15, 23, 42, 0.45)';
                targetCtx.lineWidth = 1.2;
                targetCtx.stroke();
            }

            function drawBlock(matrix, offset, targetCtx, cellSize) {
                if (!matrix || !targetCtx) return;
                matrix.forEach((row, y) => {
                    row.forEach((val, x) => {
                        if (val !== 0) {
                            drawSingleCube(targetCtx, x + offset.x, y + offset.y, val, cellSize);
                        }
                    });
                });
            }

            function drawGhost() {
                if (!player.matrix || !ctx) return;
                const ghost = {
                    pos: { x: player.pos.x, y: player.pos.y },
                    matrix: player.matrix
                };
                while (!checkCollide(arena, ghost)) {
                    ghost.pos.y++;
                }
                ghost.pos.y--;

                if (ghost.pos.y <= player.pos.y) return;

                player.matrix.forEach((row, y) => {
                    row.forEach((val, x) => {
                        if (val !== 0) {
                            const gx = (x + ghost.pos.x) * CELL;
                            const gy = (y + ghost.pos.y) * CELL;
                            const pad = 2;
                            const s = CELL - pad * 2;
                            ctx.save();
                            drawRoundedRect(ctx, gx + pad, gy + pad, s, s, 5);
                            ctx.fillStyle = 'rgba(147, 197, 253, 0.12)';
                            ctx.fill();
                            ctx.strokeStyle = 'rgba(186, 230, 253, 0.45)';
                            ctx.lineWidth = 1.5;
                            ctx.setLineDash([4, 3]);
                            ctx.stroke();
                            ctx.restore();
                        }
                    });
                });
            }

            function drawPreviewOnCanvas(targetCtx, pieceType, cellSize) {
                if (!targetCtx) return;
                const w = targetCtx.canvas.width;
                const h = targetCtx.canvas.height;
                targetCtx.clearRect(0, 0, w, h);

                const m = getPiece(pieceType);
                let minX = m[0].length, maxX = -1, minY = m.length, maxY = -1;
                m.forEach((row, y) => {
                    row.forEach((val, x) => {
                        if (val !== 0) {
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            if (y < minY) minY = y;
                            if (y > maxY) maxY = y;
                        }
                    });
                });
                const pw = (maxX - minX + 1) * cellSize;
                const ph = (maxY - minY + 1) * cellSize;
                const startX = (w - pw) / 2 - minX * cellSize;
                const startY = (h - ph) / 2 - minY * cellSize;

                m.forEach((row, y) => {
                    row.forEach((val, x) => {
                        if (val !== 0) {
                            drawSingleCube(
                                targetCtx,
                                startX / cellSize + x,
                                startY / cellSize + y,
                                val,
                                cellSize
                            );
                        }
                    });
                });
            }

            function drawQueuePreviews() {
                if (queue.length < 2) refillQueue();
                drawPreviewOnCanvas(nextCtx1, queue[0], 11);
                drawPreviewOnCanvas(nextCtx2, queue[1], 8);
            }

            function renderScene() {
                if (!ctx || !canvas) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = 'rgba(96, 165, 250, 0.14)';
                ctx.lineWidth = 1;
                for (let x = 0; x <= COLS; x++) {
                    ctx.beginPath();
                    ctx.moveTo(x * CELL, 0);
                    ctx.lineTo(x * CELL, ROWS * CELL);
                    ctx.stroke();
                }
                for (let y = 0; y <= ROWS; y++) {
                    ctx.beginPath();
                    ctx.moveTo(0, y * CELL);
                    ctx.lineTo(COLS * CELL, y * CELL);
                    ctx.stroke();
                }

                drawBlock(arena, { x: 0, y: 0 }, ctx, CELL);
                if (isPlaying && player.matrix) {
                    drawGhost();
                    drawBlock(player.matrix, player.pos, ctx, CELL);
                }
            }

            function gameLoop(time = 0) {
                if (!isPlaying || isPaused) return;
                const delta = time - lastTime;
                lastTime = time;
                dropCounter += delta;
                if (dropCounter > dropInterval) {
                    playerDropStep();
                }
                renderScene();
                animId = requestAnimationFrame(gameLoop);
            }

            function playerDropStep() {
                player.pos.y++;
                if (checkCollide(arena, player)) {
                    player.pos.y--;
                    mergePiece();
                    resetPlayer();
                    clearLines();
                    updateScoreDisplay();
                }
                dropCounter = 0;
            }

            function updateScoreDisplay() {
                const sEl = document.getElementById('score-text');
                const lEl = document.getElementById('level');
                const bEl = document.getElementById('progress-bar');
                const pEl = document.getElementById('progress-pct');
                const nxtInfo = document.getElementById('next-level-info');
                const movesEl = document.getElementById('moves-count');
                const linesEl = document.getElementById('lines-count');

                if (sEl) sEl.innerText = `Skor: ${player.score.toLocaleString()}`;
                if (lEl) lEl.innerText = `${player.level}/99`;
                if (movesEl) movesEl.innerText = `${player.moves}`;
                if (linesEl) linesEl.innerText = `${player.lines} Baris`;

                const target = 2000;
                const remaining = Math.max(0, target - player.score);
                const pct = Math.min(100, Math.round((player.score / target) * 100));

                if (pEl) pEl.innerText = `${pct}%`;
                if (bEl) bEl.style.width = `${pct}%`;

                if (nxtInfo) {
                    if (player.score >= target) {
                        nxtInfo.innerText = 'SASARAN CAPAI!';
                        nxtInfo.className = 'text-[10px] font-bold text-emerald-300 leading-tight';
                    } else {
                        nxtInfo.innerText = `Lagi ${remaining.toLocaleString()} pts`;
                        nxtInfo.className = 'text-[10px] font-semibold text-cyan-200 leading-tight';
                    }
                }
            }

            function triggerGameOver() {
                isPlaying = false;
                if (animId) cancelAnimationFrame(animId);
                const overlay = document.getElementById('game-overlay');
                if (overlay) {
                    document.getElementById('overlay-title').innerText = 'TAMAT PERMAINAN';
                    document.getElementById('overlay-desc').innerHTML =
                        `Skor Akhir: <strong class="text-amber-300 text-base">${player.score.toLocaleString()}</strong><br>` +
                        `Tahap: <strong class="text-cyan-300">${player.level}</strong> • Baris: <strong class="text-emerald-300">${player.lines}</strong>`;
                    document.getElementById('start-btn').innerText = 'MAIN SEMULA';
                    overlay.classList.remove('hidden');
                }
            }

            window.startTetrisGame = function() {
                initAudio();
                initGameVars();
                isPlaying = true;
                isPaused = false;
                const label = document.getElementById('pause-label');
                if (label) label.innerText = 'Jeda';
                const overlay = document.getElementById('game-overlay');
                if (overlay) overlay.classList.add('hidden');
                resetPlayer();
                updateScoreDisplay();
                lastTime = performance.now();
                if (animId) cancelAnimationFrame(animId);
                gameLoop();
            };

            window.toggleGamePause = function() {
                if (!isPlaying) return;
                isPaused = !isPaused;
                const overlay = document.getElementById('game-overlay');
                const label = document.getElementById('pause-label');
                if (isPaused) {
                    if (label) label.innerText = 'Main';
                    document.getElementById('overlay-title').innerText = 'DIJEDA';
                    document.getElementById('overlay-desc').innerHTML = `Skor Semasa: <strong class="text-amber-300 text-base">${player.score.toLocaleString()}</strong>`;
                    document.getElementById('start-btn').innerText = 'SAMBUNG MAIN';
                    if (overlay) overlay.classList.remove('hidden');
                } else {
                    if (label) label.innerText = 'Jeda';
                    if (overlay) overlay.classList.add('hidden');
                    lastTime = performance.now();
                    gameLoop();
                }
            };

            window.actionMove = function(dir) {
                if (!isPlaying || isPaused || !player.matrix) return;
                player.pos.x += dir;
                if (checkCollide(arena, player)) {
                    player.pos.x -= dir;
                } else {
                    playSound('move');
                    renderScene();
                }
            };

            window.actionRotate = function() {
                if (!isPlaying || isPaused || !player.matrix) return;
                const px = player.pos.x;
                let offset = 1;
                rotateMatrix(player.matrix, 1);
                while (checkCollide(arena, player)) {
                    player.pos.x += offset;
                    offset = -(offset + (offset > 0 ? 1 : -1));
                    if (Math.abs(offset) > player.matrix[0].length) {
                        rotateMatrix(player.matrix, -1);
                        player.pos.x = px;
                        return;
                    }
                }
                playSound('rotate');
                renderScene();
            };

            window.actionSoftDrop = function() {
                if (!isPlaying || isPaused || !player.matrix) return;
                playerDropStep();
                playSound('move');
                renderScene();
            };

            window.actionHardDrop = function() {
                if (!isPlaying || isPaused || !player.matrix) return;
                while (!checkCollide(arena, player)) {
                    player.pos.y++;
                }
                player.pos.y--;
                mergePiece();
                resetPlayer();
                clearLines();
                updateScoreDisplay();
                dropCounter = 0;
                playSound('drop');
                renderScene();
            };

            function setupTouchGestures() {
                if (!canvas) return;
                let touchStartX = 0;
                let touchStartY = 0;
                let lastStepX = 0;
                let lastStepY = 0;
                let moved = false;

                canvas.addEventListener('touchstart', (e) => {
                    if (!isPlaying || isPaused) return;
                    const t = e.touches[0];
                    touchStartX = t.clientX;
                    touchStartY = t.clientY;
                    lastStepX = 0;
                    lastStepY = 0;
                    moved = false;
                }, { passive: true });

                canvas.addEventListener('touchmove', (e) => {
                    if (!isPlaying || isPaused) return;
                    const t = e.touches[0];
                    const dx = t.clientX - touchStartX;
                    const dy = t.clientY - touchStartY;
                    const stepSize = 26;

                    const stepsX = Math.trunc(dx / stepSize);
                    if (stepsX !== lastStepX) {
                        const diff = stepsX - lastStepX;
                        const dir = diff > 0 ? 1 : -1;
                        for (let i = 0; i < Math.abs(diff); i++) {
                            window.actionMove(dir);
                        }
                        lastStepX = stepsX;
                        moved = true;
                    }

                    const stepsY = Math.trunc(dy / stepSize);
                    if (stepsY > lastStepY) {
                        const diffY = stepsY - lastStepY;
                        for (let i = 0; i < diffY; i++) {
                            window.actionSoftDrop();
                        }
                        lastStepY = stepsY;
                        moved = true;
                    }
                }, { passive: true });

                canvas.addEventListener('touchend', (e) => {
                    if (!isPlaying || isPaused) return;
                    const t = e.changedTouches[0];
                    const dy = t.clientY - touchStartY;
                    if (!moved && Math.abs(t.clientX - touchStartX) < 12 && Math.abs(dy) < 12) {
                        window.actionRotate();
                    } else if (dy > 95 && Math.abs(lastStepX) === 0) {
                        window.actionHardDrop();
                    }
                }, { passive: true });
            }

            window.addEventListener('keydown', (e) => {
                if (!isPlaying || isPaused) return;
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') window.actionMove(-1);
                else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') window.actionMove(1);
                else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') window.actionSoftDrop();
                else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') window.actionRotate();
                else if (e.key === ' ') {
                    e.preventDefault();
                    window.actionHardDrop();
                } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
                    window.toggleGamePause();
                }
            });

            window.addEventListener('DOMContentLoaded', () => {
                canvas = document.getElementById('tetris');
                if (canvas) ctx = canvas.getContext('2d');

                const c1 = document.getElementById('nextCanvas1');
                const c2 = document.getElementById('nextCanvas2');
                if (c1) nextCtx1 = c1.getContext('2d');
                if (c2) nextCtx2 = c2.getContext('2d');

                arena = makeMatrix(COLS, ROWS);
                refillQueue();
                player.matrix = getPiece(queue[0]);
                player.pos.x = ((COLS / 2) | 0) - ((player.matrix[0].length / 2) | 0);
                drawQueuePreviews();
                updateScoreDisplay();
                setupTouchGestures();
                renderScene();
            });
        })();
    </script>
</body>
</html>
